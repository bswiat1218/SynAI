name: Manually publish a verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package version (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-synai
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be vX.Y.Z" >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify checkout is the requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Install build and verification tools
        run: python -m pip install '.[release]'
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify exact tag, clean installs, and installed tests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --run-tests
      - name: Record verified version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: verified-synai-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: verified/
      - name: Check checksums and select exactly the verified release pair
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          (cd verified && sha256sum -c SHA256SUMS)
          mkdir dist
          cp "verified/synai-$RELEASE_VERSION-py3-none-any.whl" dist/
          cp "verified/synai-$RELEASE_VERSION.tar.gz" dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
