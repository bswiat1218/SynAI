name: Test source checkout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e .
      - name: Run source test suite
        run: python -m unittest discover -s tests -v
      - name: Install graphical editor test prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb
      - name: Test graphical editor child from source
        run: SYNAI_TEST_DESKTOP=1 xvfb-run -a python -m unittest discover -s tests -p 'test_editor.py'
      - name: Verify bundled editor desktop without external editor dependencies
        run: |
          SYNAI_TEST_DESKTOP=1 xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_editor_desktop.py'
