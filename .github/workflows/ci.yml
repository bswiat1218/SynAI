name: Test and build distributions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and verification tools
        run: python -m pip install '.[release]'
      - name: Build wheel and source archive
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify clean installations and run installed test suite
        run: python scripts/verify_release.py --run-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synai-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
